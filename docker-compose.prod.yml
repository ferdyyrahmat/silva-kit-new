version: '3.8'

services:
  # Production PHP-FPM Application
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    container_name: silva-app-prod
    restart: always
    working_dir: /var/www/html
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-silva_kit_prod}
      - DB_USERNAME=${DB_USERNAME:-silva_prod_user}
      - DB_PASSWORD=${DB_PASSWORD:-silva_prod_password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - silva-prod-network

  # Production Nginx Server
  web:
    image: nginx:alpine
    container_name: silva-web-prod
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - silva-prod-network

  # Production MySQL Database
  db:
    image: mysql:8.0
    container_name: silva-db-prod
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-silva_kit_prod}
      MYSQL_USER: ${DB_USERNAME:-silva_prod_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-silva_prod_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-prod_root_secret}
    volumes:
      - silva-prod-dbdata:/var/lib/mysql
    networks:
      - silva-prod-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  # Production Redis Cache & Queue Engine
  redis:
    image: redis:7-alpine
    container_name: silva-redis-prod
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - silva-prod-redisdata:/data
    networks:
      - silva-prod-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 5

  # Production Queue Worker Service
  queue-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    container_name: silva-queue-worker-prod
    restart: always
    working_dir: /var/www/html
    command: php artisan queue:work redis --tries=3 --timeout=90
    environment:
      - APP_ENV=production
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-silva_kit_prod}
      - DB_USERNAME=${DB_USERNAME:-silva_prod_user}
      - DB_PASSWORD=${DB_PASSWORD:-silva_prod_password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    depends_on:
      - app
      - db
      - redis
    networks:
      - silva-prod-network

  # Production MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: silva-minio-prod
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioprodadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioprodsecretkey}
    command: server /data --console-address ":9001"
    volumes:
      - silva-prod-miniodata:/data
    networks:
      - silva-prod-network

  # Automatic MinIO Bucket Initialization Job
  minio-init:
    image: minio/mc:latest
    container_name: silva-minio-prod-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioprodadmin} ${MINIO_ROOT_PASSWORD:-minioprodsecretkey}; do echo 'Waiting for MinIO...'; sleep 2; done;
      /usr/bin/mc mb --ignore-existing myminio/${AWS_BUCKET:-silva-bucket};
      /usr/bin/mc anonymous set download myminio/${AWS_BUCKET:-silva-bucket};
      echo 'Production MinIO Bucket ready!';
      "
    networks:
      - silva-prod-network

networks:
  silva-prod-network:
    driver: bridge

volumes:
  silva-prod-dbdata:
    driver: local
  silva-prod-redisdata:
    driver: local
  silva-prod-miniodata:
    driver: local
